[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtimetts-gmicloud"
description = "GMI Cloud text-to-speech engine for RealtimeTTS (Inworld, MiniMax, Chatterbox)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jayanng", email = "johnenyenihi2017@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "realtimetts>=0.8.10",
    "requests>=2.31",
]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/Jayanng/realtimetts-gmicloud"

[tool.hatch.version]
path = "src/realtimetts_gmicloud/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/realtimetts_gmicloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
